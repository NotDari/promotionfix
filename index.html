<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Meal Deal Demo</title>
<style>
  :root {
    /* Theme tokens */
    --brand: #00539f;          /* Tesco blue */
    --brand-dark: #003d7a;
    --brand-tint: #e8f0f8;
    --clubcard: #ffd400;       /* Clubcard yellow */
    --search-red: #ee1c2e;
    --bg: #ffffff;
    --divider: #f0f0f0;
    --text: #333333;
    --text-muted: #666666;
    --border: #e3e3e3;
    --header-h: 56px;
    --tabbar-h: 68px;

    /* Desktop frame */
    --desk-bg: #e9eaee;
    --frame: #111;
    --phone-w: 390px;
    --phone-h: 844px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--desk-bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- Device shell ---------- */
  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .phone {
    position: relative;
    width: var(--phone-w);
    height: min(var(--phone-h), calc(100vh - 48px));
    border: 12px solid var(--frame);
    border-radius: 52px;
    background: var(--bg);
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,.25);
  }
  .notch {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 30px; border-radius: 20px; background: var(--frame);
    z-index: 50;
  }
  .statusbar {
    height: 44px; padding: 0 28px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600;
  }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; }

  /* Phone: the app fills the real screen, no fake frame */
  @media (max-width: 500px), (pointer: coarse) and (max-width: 900px) {
    body { background: var(--bg); }
    .stage { padding: 0; display: block; min-height: 0; }
    .phone {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0; border-radius: 0; box-shadow: none;
    }
    .notch, .statusbar { display: none; }
    .app { padding-top: env(safe-area-inset-top); }
  }

  /* ---------- App layout ---------- */
  .app {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
  }
  .phone:has(.statusbar) .app { top: 44px; }
  @media (max-width: 500px), (pointer: coarse) and (max-width: 900px) {
    .phone:has(.statusbar) .app { top: 0; }
  }

  /* Equal side columns keep the title centred */
  .header {
    height: var(--header-h); flex-shrink: 0;
    display: grid; grid-template-columns: 48px 1fr 48px; align-items: center;
    padding: 0 6px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .header h1 {
    font-size: 18px; font-weight: 600; color: var(--text); text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .header .actions { display: flex; justify-content: flex-end; }
  .icon-btn {
    position: relative;
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    color: var(--brand);
  }
  .icon-btn:active { background: var(--divider); }

  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); }

  /* ---------- Offer banner ---------- */
  .offer { padding: 12px 12px 10px; }
  .offer-tag { display: flex; align-items: stretch; }
  .offer-tag .cc {
    flex-shrink: 0; width: 70px;
    align-self: flex-start;
    min-height: 56px;
    display: grid; place-items: center; text-align: center;
    background: var(--brand); color: #fff;
    font-size: 10px; font-weight: 600; line-height: 1.2;
    border-radius: 8px 0 0 8px;
  }
  .offer-tag .deal {
    flex: 1;
    background: var(--clubcard); color: var(--brand-dark);
    font-size: 16px; font-weight: 700; line-height: 1.3;
    padding: 10px 12px;
    border-radius: 0 10px 10px 10px;
  }
  .offer .valid { text-align: right; font-size: 13px; color: var(--text-muted); margin-top: 10px; }

  /* ---------- Meal deal steps ---------- */
  .steps {
    flex-shrink: 0;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .step {
    position: relative;
    min-height: 92px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 8px 6px;
    border: 2px dashed var(--border); border-radius: 10px;
    text-align: center;
  }
  .step.active { border: 2px solid var(--brand); background: var(--brand-tint); }
  .step.filled { border-style: solid; }
  .step-label {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    padding: 0 6px; background: var(--bg);
    font-size: 10px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase;
    color: var(--text-muted);
  }
  .step.active .step-label { color: var(--brand); }
  .step-thumb { font-size: 30px; line-height: 1; height: 32px; display: grid; place-items: center; }
  .step-thumb img { width: 32px; height: 32px; object-fit: contain; }
  .step-plus { color: var(--brand); font-size: 26px; font-weight: 300; }
  .step-name {
    font-size: 11px; font-weight: 600; line-height: 1.25; color: var(--brand);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .step-hint { font-size: 11px; color: var(--text-muted); }
  .step-remove {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--text); color: #fff;
  }

  .deal-done {
    margin: 2px 12px 14px;
    display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center;
    padding: 12px;
    border: 2px solid var(--brand); border-radius: 12px;
    background: var(--bg);
    box-shadow: 0 4px 14px rgba(0, 83, 159, .12);
  }
  .deal-done[hidden] { display: none; }
  .dd-check {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--brand); color: #fff;
  }
  .dd-title { font-size: 16px; font-weight: 700; color: var(--brand); }
  .dd-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .dd-save {
    display: inline-block; margin-top: 6px; padding: 2px 8px;
    border-radius: 10px;
    background: var(--clubcard); color: var(--brand-dark);
    font-size: 12px; font-weight: 800;
  }
  .dd-price { text-align: right; }
  .dd-price strong { display: block; font-size: 24px; line-height: 1; color: var(--text); }
  .dd-price s { display: block; margin-top: 4px; font-size: 13px; color: var(--text-muted); }

  .section-title {
    padding: 12px 12px 10px;
    border-top: 12px solid var(--divider);
    border-bottom: 6px solid var(--divider);
  }
  .section-title .kicker { font-size: 12px; color: var(--text-muted); }
  .section-title h2 { font-size: 18px; margin-top: 2px; }

  /* ---------- Product list ---------- */
  .product {
    display: grid; grid-template-columns: 76px 1fr 40px; gap: 0 12px;
    padding: 14px 12px;
    border-bottom: 6px solid var(--divider);
  }
  .product-img {
    grid-row: span 2;
    width: 76px; height: 76px;
    display: grid; place-items: center;
    font-size: 52px;
  }
  .product-img img { width: 100%; height: 100%; object-fit: contain; }
  .product-name { font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--brand); padding-top: 4px; }
  .aisle {
    display: inline-flex; align-items: center; gap: 4px;
    align-self: flex-end; margin-bottom: 2px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--divider); color: var(--text-muted);
    font-size: 11px; font-weight: 600;
  }
  .fav { width: 40px; height: 40px; display: grid; place-items: center; color: var(--brand); margin-top: -6px; }
  .fav.on svg { fill: var(--brand); }
  .buy-row {
    grid-column: 2 / 4;
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 6px;
  }
  .price { font-size: 20px; font-weight: 700; }
  .unit { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  .add-btn {
    width: 104px; height: 38px; border-radius: 19px;
    background: var(--brand); color: #fff;
    font-weight: 700; font-size: 16px;
  }
  .add-btn:active { background: var(--brand-dark); }
  .add-btn:disabled { background: #c4c4c4; color: #fff; cursor: not-allowed; }
  .add-btn.picked { background: var(--bg); color: var(--brand); border: 2px solid var(--brand); }
  .sold-out {
    display: inline-block; margin-top: 4px; padding: 2px 8px;
    border-radius: 10px;
    background: #fde8ea; color: var(--search-red);
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
  }
  .product.is-sold-out .product-img { opacity: .45; }

  .list-end { padding: 20px 12px 28px; text-align: center; font-size: 13px; color: var(--text-muted); }
  .list-end strong { display: block; font-size: 16px; color: var(--text); margin-bottom: 4px; }

  /* ---------- Search ---------- */
  .searchbar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .searchbar[hidden] { display: none; }
  .search-field {
    flex: 1; display: flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 10px 0 12px;
    border: 2px solid var(--brand); border-radius: 20px;
    color: var(--brand);
  }
  .search-field input {
    flex: 1; min-width: 0;
    border: 0; outline: 0; background: none;
    font: inherit; font-size: 16px; color: var(--text);
  }
  .search-field input::-webkit-search-cancel-button { display: none; }
  .clear-btn { display: grid; place-items: center; width: 24px; height: 24px; color: var(--text-muted); }
  .clear-btn[hidden] { display: none; }
  .cancel-btn { color: var(--brand); font-weight: 600; font-size: 15px; }
  .result-count { padding: 10px 12px 8px; font-size: 13px; color: var(--text-muted); border-bottom: 6px solid var(--divider); }
  .result-count[hidden] { display: none; }

  /* ---------- Tab bar ---------- */
  .tabbar {
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    flex-shrink: 0;
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 12px; color: var(--text-muted);
  }
  .tab svg { width: 24px; height: 24px; }
  .tab-icon {
    position: relative;
    width: 50px; height: 28px; border-radius: 14px;
    display: grid; place-items: center;
  }
  .tab.active { color: var(--text); font-weight: 700; }
  .tab.active .tab-icon { background: var(--search-red); color: #fff; }

  /* ---------- Toast ---------- */
  .toast {
    position: absolute; left: 16px; right: 16px;
    bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px);
    background: #222; color: #fff;
    padding: 12px 16px; border-radius: 10px;
    font-size: 14px; text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
    opacity: 0; transform: translateY(10px);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
    z-index: 40;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar">
      <span id="clock">9:41</span>
      <span class="icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="21" height="11" rx="3"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="currentColor" stroke="none"/><path d="M23 4v4" stroke-width="1.5"/></svg>
      </span>
    </div>

    <div class="app">
      <header class="header">
        <button class="icon-btn" data-demo aria-label="Back">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1>Meal Deal</h1>
        <div class="actions">
          <button class="icon-btn" data-search aria-label="Search">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          </button>
        </div>
      </header>

      <div class="searchbar" id="searchbar" hidden>
        <label class="search-field">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="searchInput" type="search" placeholder="Search mains" autocomplete="off" enterkeyhint="search">
          <button class="clear-btn" id="clearBtn" aria-label="Clear search" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </label>
        <button class="cancel-btn" id="cancelBtn">Cancel</button>
      </div>

      <!-- What's been picked so far; the active box is the course being chosen -->
      <div class="steps" id="steps"></div>

      <main class="content" id="content">
        <section class="offer">
          <div class="offer-tag">
            <div class="cc">Clubcard<br>Price</div>
            <div class="deal">Meal Deal £3.85 Clubcard Price - Main, Snack &amp; Drink</div>
          </div>
          <div class="valid">Valid in Hammersmith Superstore</div>
        </section>

        <div class="deal-done" id="dealDone" hidden></div>

        <div class="section-title">
          <div class="kicker" id="stepKicker"></div>
          <h2 id="stepTitle"></h2>
        </div>

        <div class="result-count" id="resultCount" hidden></div>
        <div id="products"></div>
        <div class="list-end" id="listEnd"></div>
      </main>

      <nav class="tabbar">
        <button class="tab" data-demo>
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"/></svg></span>
          Home
        </button>
        <button class="tab" data-demo>
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></span>
          Favourites
        </button>
        <button class="tab active" data-search>
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg></span>
          Search
        </button>
        <button class="tab" data-demo>
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 11h6M9 14h6"/></svg></span>
          Clubcard
        </button>
        <button class="tab" data-demo>
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-2 10H5z"/><path d="M8 10l3-6M16 10l-3-6M9 14v3M12 14v3M15 14v3"/></svg></span>
          Basket
        </button>
      </nav>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>

<script>
  // ---------- Meal deal data ----------
  const DEAL_PRICE = 3.85;

  const courses = [
    { id: 'main',  label: 'Main',  plural: 'mains',  title: 'Choose your main' },
    { id: 'snack', label: 'Snack', plural: 'snacks', title: 'Choose your snack' },
    { id: 'drink', label: 'Drink', plural: 'drinks', title: 'Choose your drink' },
  ];

  const products = [
    { id: 1,  course: 'main',  emoji: '🥪', name: 'Tesco Chicken & Bacon Sandwich',         price: 3.40, unit: '£3.40 each', aisle: 1 },
    { id: 2,  course: 'main',  emoji: '🥚', name: 'Tesco Egg Mayonnaise Sandwich',          price: 2.20, unit: '£2.20 each', aisle: 1 },
    { id: 3,  course: 'main',  emoji: '🌯', name: 'Tesco Chicken Caesar Wrap',              price: 3.25, unit: '£3.25 each', aisle: 1 },
    { id: 4,  course: 'main',  emoji: '🍝', name: 'Tesco Tomato & Mozzarella Pasta 300G',   price: 3.00, unit: '£10.00/kg',  aisle: 1 },
    { id: 5,  course: 'main',  emoji: '🍣', name: 'Tesco Salmon Sushi Selection 160G',      price: 3.75, unit: '£23.44/kg',  aisle: 1, soldOut: true },
    { id: 6,  course: 'main',  emoji: '🥗', name: 'Tesco Falafel & Houmous Salad Bowl',     price: 3.10, unit: '£3.10 each', aisle: 1 },

    { id: 11, course: 'snack', emoji: '🥔', name: 'Walkers Ready Salted Crisps 45G',        price: 1.25, unit: '£2.78/100g', aisle: 3 },
    { id: 12, course: 'snack', emoji: '🍇', name: 'Tesco Red Grapes 160G',                  price: 1.30, unit: '£8.13/kg',   aisle: 1 },
    { id: 13, course: 'snack', emoji: '🍪', name: 'Tesco Chocolate Chip Cookies 2 Pack',    price: 1.00, unit: '£0.50 each', aisle: 4 },
    { id: 14, course: 'snack', emoji: '🍿', name: 'Propercorn Lightly Sea Salted 20G',      price: 1.15, unit: '£5.75/100g', aisle: 3 },
    { id: 15, course: 'snack', emoji: '🍍', name: 'Tesco Pineapple Fruit Pot 180G',         price: 1.50, unit: '£8.33/kg',   aisle: 1 },

    { id: 21, course: 'drink', emoji: '🥤', name: 'Coca-Cola Zero Sugar 500ML',             price: 1.85, unit: '£3.70/litre', aisle: 2 },
    { id: 22, course: 'drink', emoji: '💧', name: 'Tesco Still Spring Water 500ML',         price: 0.65, unit: '£1.30/litre', aisle: 2 },
    { id: 23, course: 'drink', emoji: '🍊', name: 'Innocent Orange Juice 330ML',            price: 2.10, unit: '£6.36/litre', aisle: 2 },
    { id: 24, course: 'drink', emoji: '☕', name: 'Starbucks Caramel Frappuccino 250ML',    price: 2.30, unit: '£9.20/litre', aisle: 2 },
    { id: 25, course: 'drink', emoji: '🧃', name: 'Ribena Blackcurrant 500ML',              price: 1.60, unit: '£3.20/litre', aisle: 2 },
  ];

  const picked = { main: null, snack: null, drink: null };   // course id -> product
  let current = 'main';
  const favourites = new Set();

  const fmt = n => `£${n.toFixed(2)}`;
  const thumb = p => p.img ? `<img src="${p.img}" alt="">` : p.emoji;
  const courseOf = id => courses.find(c => c.id === id);

  const heart = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
  const pin = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  const cross = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  // ---------- Search ----------
  const searchbar = document.getElementById('searchbar');
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const countEl = document.getElementById('resultCount');
  const endEl = document.getElementById('listEnd');
  let query = '';

  function openSearch() {
    searchbar.hidden = false;
    searchInput.focus();
  }
  function closeSearch() {
    searchbar.hidden = true;
    searchInput.value = '';
    setQuery('');
  }
  function setQuery(q) {
    query = q.trim().toLowerCase();
    clearBtn.hidden = !q;
    renderProducts();
  }
  searchInput.addEventListener('input', () => setQuery(searchInput.value));
  searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchInput.blur(); });
  clearBtn.addEventListener('click', e => {
    e.preventDefault();
    searchInput.value = '';
    setQuery('');
    searchInput.focus();
  });
  document.getElementById('cancelBtn').addEventListener('click', closeSearch);

  // ---------- Steps (Main / Snack / Drink boxes) ----------
  const stepsEl = document.getElementById('steps');
  const dealDoneEl = document.getElementById('dealDone');

  function renderSteps() {
    stepsEl.innerHTML = courses.map(c => {
      const p = picked[c.id];
      const cls = ['step', c.id === current && 'active', p && 'filled'].filter(Boolean).join(' ');
      const body = p
        ? `<span class="step-thumb">${thumb(p)}</span>
           <span class="step-name">${p.name}</span>`
        : `<span class="step-plus">+</span>
           <span class="step-hint">${c.id === current ? 'Choosing…' : `Pick a ${c.label.toLowerCase()}`}</span>`;
      return `
        <div class="${cls}" data-step="${c.id}" role="button" tabindex="0" aria-label="${c.label}">
          <span class="step-label">${c.label}</span>
          ${body}
          ${p ? `<button class="step-remove" data-remove="${c.id}" aria-label="Remove ${c.label.toLowerCase()}">${cross}</button>` : ''}
        </div>`;
    }).join('');

    const chosen = Object.values(picked);
    if (chosen.every(Boolean)) {
      const separate = chosen.reduce((sum, p) => sum + p.price, 0);
      const saving = Math.max(0, separate - DEAL_PRICE);
      dealDoneEl.hidden = false;
      dealDoneEl.innerHTML = `
        <span class="dd-check"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <div>
          <div class="dd-title">Meal deal complete</div>
          <div class="dd-sub">Main, snack &amp; drink chosen</div>
          ${saving ? `<span class="dd-save">Save ${fmt(saving)} with Clubcard</span>` : ''}
        </div>
        <div class="dd-price">
          <strong>${fmt(DEAL_PRICE)}</strong>
          ${saving ? `<s>${fmt(separate)}</s>` : ''}
        </div>`;
    } else {
      dealDoneEl.hidden = true;
    }

    const c = courseOf(current);
    const n = courses.indexOf(c) + 1;
    document.getElementById('stepKicker').textContent = `Step ${n} of 3`;
    document.getElementById('stepTitle').textContent = c.title;
    searchInput.placeholder = `Search ${c.plural}`;
  }

  function setCourse(id) {
    current = id;
    // A new course starts with a fresh search
    searchInput.value = '';
    query = '';
    clearBtn.hidden = true;
    renderAll();
    document.getElementById('content').scrollTop = 0;
  }

  // ---------- Product list ----------
  const listEl = document.getElementById('products');

  function renderProducts() {
    const c = courseOf(current);
    // Every word typed must appear somewhere in the product name
    const words = query.split(/\s+/).filter(Boolean);
    const visible = products.filter(p => {
      if (p.course !== current) return false;
      const text = `${p.name} aisle ${p.aisle}`.toLowerCase();
      return words.every(w => text.includes(w));
    });

    countEl.hidden = !query;
    countEl.textContent = `${visible.length} ${visible.length === 1 ? c.label.toLowerCase() : c.plural} for “${searchInput.value.trim()}”`;
    endEl.innerHTML = !visible.length
      ? `<strong>No ${c.plural} found</strong>Try a different search term`
      : query ? '' : `That's all the ${c.plural} in this meal deal`;

    listEl.innerHTML = visible.map(p => {
      const isPicked = picked[p.course]?.id === p.id;
      const control = p.soldOut
        ? `<button class="add-btn" disabled>Choose</button>`
        : isPicked
          ? `<button class="add-btn picked" data-unpick="${p.id}">✓ Chosen</button>`
          : `<button class="add-btn" data-pick="${p.id}">Choose</button>`;
      return `
        <article class="product${p.soldOut ? ' is-sold-out' : ''}">
          <div class="product-img">${thumb(p)}</div>
          <div class="product-name">${p.name}${p.soldOut ? '<br><span class="sold-out">Sold out</span>' : ''}</div>
          <button class="fav${favourites.has(p.id) ? ' on' : ''}" data-fav="${p.id}" aria-label="Favourite">${heart}</button>
          <div class="buy-row">
            <div>
              <div class="price">${fmt(p.price)}</div>
              <div class="unit">${p.unit}</div>
            </div>
            <span class="aisle">${pin} Aisle ${p.aisle}</span>
            ${control}
          </div>
        </article>`;
    }).join('');
  }

  function renderAll() {
    renderSteps();
    renderProducts();
  }

  // ---------- Toast ----------
  const toastEl = document.getElementById('toast');
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  // ---------- Events ----------
  const byId = id => products.find(p => p.id === Number(id));

  document.addEventListener('click', e => {
    if (e.target.closest('[data-demo]')) return toast('Not part of this demo');
    if (e.target.closest('[data-search]')) return openSearch();

    const remove = e.target.closest('[data-remove]');
    if (remove) {
      const id = remove.dataset.remove;
      toast(`Removed your ${courseOf(id).label.toLowerCase()}`);
      picked[id] = null;
      return setCourse(id);
    }

    const step = e.target.closest('[data-step]');
    if (step) return setCourse(step.dataset.step);

    const fav = e.target.closest('[data-fav]');
    if (fav) {
      const id = Number(fav.dataset.fav);
      favourites.has(id) ? favourites.delete(id) : favourites.add(id);
      toast(favourites.has(id) ? 'Added to favourites' : 'Removed from favourites');
      return renderProducts();
    }

    const pick = e.target.closest('[data-pick]');
    if (pick) {
      const p = byId(pick.dataset.pick);
      picked[p.course] = p;
      toast(`${courseOf(p.course).label} chosen`);
      // Move on to the next course that still needs picking
      const next = courses.find(c => !picked[c.id]);
      return next ? setCourse(next.id) : renderAll();
    }

    const unpick = e.target.closest('[data-unpick]');
    if (unpick) {
      const p = byId(unpick.dataset.unpick);
      picked[p.course] = null;
      return renderAll();
    }
  });

  stepsEl.addEventListener('keydown', e => {
    const step = e.target.closest('[data-step]');
    if (step && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); setCourse(step.dataset.step); }
  });

  // Status bar clock (desktop frame only)
  const clock = document.getElementById('clock');
  const tick = () => clock.textContent =
    new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/i, '');
  tick(); setInterval(tick, 30000);

  renderAll();
</script>
</body>
</html>
