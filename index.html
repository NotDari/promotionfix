<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Grocery App Demo</title>
<style>
  :root {
    /* Theme tokens */
    --brand: #00539f;          /* Tesco blue */
    --brand-dark: #003d7a;
    --clubcard: #ffd400;       /* Clubcard yellow */
    --search-red: #ee1c2e;
    --bg: #ffffff;
    --divider: #f0f0f0;
    --text: #333333;
    --text-muted: #666666;
    --border: #e3e3e3;
    --header-h: 56px;
    --tabbar-h: 68px;

    /* Desktop frame */
    --desk-bg: #e9eaee;
    --frame: #111;
    --phone-w: 390px;
    --phone-h: 844px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--desk-bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- Device shell ---------- */
  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .phone {
    position: relative;
    width: var(--phone-w);
    height: min(var(--phone-h), calc(100vh - 48px));
    border: 12px solid var(--frame);
    border-radius: 52px;
    background: var(--bg);
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,.25);
  }
  .notch {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 30px; border-radius: 20px; background: var(--frame);
    z-index: 50;
  }
  .statusbar {
    height: 44px; padding: 0 28px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600;
  }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; }

  /* Phone: the app fills the real screen, no fake frame */
  @media (max-width: 500px), (pointer: coarse) and (max-width: 900px) {
    body { background: var(--bg); }
    .stage { padding: 0; display: block; min-height: 0; }
    .phone {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0; border-radius: 0; box-shadow: none;
    }
    .notch, .statusbar { display: none; }
    .app { padding-top: env(safe-area-inset-top); }
  }

  /* ---------- App layout ---------- */
  .app {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
  }
  .phone:has(.statusbar) .app { top: 44px; }
  @media (max-width: 500px), (pointer: coarse) and (max-width: 900px) {
    .phone:has(.statusbar) .app { top: 0; }
  }

  /* Equal side columns keep the title centred */
  .header {
    height: var(--header-h); flex-shrink: 0;
    display: grid; grid-template-columns: 88px 1fr 88px; align-items: center;
    padding: 0 6px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .header h1 {
    font-size: 18px; font-weight: 600; color: var(--text); text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .header .actions { display: flex; justify-content: flex-end; }
  .icon-btn {
    position: relative;
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    color: var(--brand);
  }
  .icon-btn:active { background: var(--divider); }

  .badge {
    position: absolute; top: 2px; right: 0;
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px;
    background: var(--search-red); color: #fff;
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
  }
  .badge[hidden] { display: none; }

  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); }

  /* ---------- Offer banner ---------- */
  .offer { padding: 12px 12px 10px; border-bottom: 12px solid var(--divider); }
  .offer-tag { display: flex; align-items: stretch; }
  .offer-tag .cc {
    flex-shrink: 0; width: 70px;
    align-self: flex-start;
    min-height: 56px;
    display: grid; place-items: center; text-align: center;
    background: var(--brand); color: #fff;
    font-size: 10px; font-weight: 600; line-height: 1.2;
    border-radius: 8px 0 0 8px;
  }
  .offer-tag .deal {
    flex: 1;
    background: var(--clubcard); color: var(--brand-dark);
    font-size: 16px; font-weight: 700; line-height: 1.3;
    padding: 10px 12px;
    border-radius: 0 10px 10px 10px;
  }
  .offer .valid { text-align: right; font-size: 13px; color: var(--text-muted); margin-top: 10px; }

  /* ---------- Product list ---------- */
  .product {
    display: grid; grid-template-columns: 76px 1fr 40px; gap: 0 12px;
    padding: 14px 12px;
    border-bottom: 6px solid var(--divider);
  }
  .product-img {
    grid-row: span 2;
    width: 76px; height: 76px;
    display: grid; place-items: center;
    font-size: 52px;
  }
  .product-img img { width: 100%; height: 100%; object-fit: contain; }
  .product-name { font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--brand); padding-top: 4px; }
  .aisle {
    display: inline-flex; align-items: center; gap: 4px;
    align-self: flex-end; margin-bottom: 2px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--divider); color: var(--text-muted);
    font-size: 11px; font-weight: 600;
  }
  .fav { width: 40px; height: 40px; display: grid; place-items: center; color: var(--brand); margin-top: -6px; }
  .fav.on svg { fill: var(--brand); }
  .buy-row {
    grid-column: 2 / 4;
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 6px;
  }
  .price { font-size: 20px; font-weight: 700; }
  .unit { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  .add-btn, .stepper {
    width: 104px; height: 38px; border-radius: 19px;
  }
  .add-btn {
    background: var(--brand); color: #fff;
    font-weight: 700; font-size: 16px;
  }
  .add-btn:active { background: var(--brand-dark); }
  .stepper {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--brand); color: #fff; font-weight: 700;
  }
  .stepper button { width: 36px; height: 38px; font-size: 22px; line-height: 1; color: #fff; }

  .list-end { padding: 20px 12px 28px; text-align: center; font-size: 13px; color: var(--text-muted); }
  .list-end strong { display: block; font-size: 16px; color: var(--text); margin-bottom: 4px; }

  /* ---------- Search ---------- */
  .searchbar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .searchbar[hidden] { display: none; }
  .search-field {
    flex: 1; display: flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 10px 0 12px;
    border: 2px solid var(--brand); border-radius: 20px;
    color: var(--brand);
  }
  .search-field input {
    flex: 1; min-width: 0;
    border: 0; outline: 0; background: none;
    font: inherit; font-size: 16px; color: var(--text);
  }
  .search-field input::-webkit-search-cancel-button { display: none; }
  .clear-btn { display: grid; place-items: center; width: 24px; height: 24px; color: var(--text-muted); }
  .clear-btn[hidden] { display: none; }
  .cancel-btn { color: var(--brand); font-weight: 600; font-size: 15px; }
  .result-count { padding: 12px 12px 8px; font-size: 13px; color: var(--text-muted); border-bottom: 6px solid var(--divider); }
  .result-count[hidden] { display: none; }

  /* ---------- Tab bar ---------- */
  .tabbar {
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    flex-shrink: 0;
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 12px; color: var(--text-muted);
  }
  .tab svg { width: 24px; height: 24px; }
  .tab-icon {
    position: relative;
    width: 50px; height: 28px; border-radius: 14px;
    display: grid; place-items: center;
  }
  .tab.active { color: var(--text); font-weight: 700; }
  .tab.active .tab-icon { background: var(--search-red); color: #fff; }
  .tab-icon .badge { top: -4px; right: 2px; }

  /* ---------- Price check ---------- */
  .price-bar {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    margin: 0; padding: 10px 16px;
    background: var(--brand); color: #fff; text-align: left;
  }
  .price-bar[hidden] { display: none; }
  .pb-label { display: block; font-size: 12px; opacity: .85; }
  .pb-total { display: block; font-size: 18px; font-weight: 700; }
  .pb-cta { font-size: 14px; font-weight: 700; }

  .sheet-backdrop {
    position: absolute; inset: 0; z-index: 30;
    background: rgba(0,0,0,.4);
  }
  .sheet-backdrop[hidden] { display: none; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 31;
    max-height: 85%;
    display: flex; flex-direction: column;
    background: var(--bg);
    border-radius: 18px 18px 0 0;
    padding-bottom: env(safe-area-inset-bottom);
    transform: translateY(100%);
    transition: transform .25s ease;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 8px auto 0; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 0 16px; }
  .sheet-head h2 { font-size: 20px; }
  .sheet-head .icon-btn { color: var(--text-muted); }
  .sheet-note { padding: 0 16px 12px; font-size: 13px; line-height: 1.4; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  .sheet-body { overflow-y: auto; padding: 4px 16px 16px; }

  .pc-line {
    display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--divider);
    font-size: 14px;
  }
  .pc-line .emoji { font-size: 24px; text-align: center; }
  .pc-line .emoji img { width: 32px; height: 32px; display: block; }
  .pc-line .meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .pc-line .amt { font-weight: 700; }
  .pc-sum { padding-top: 12px; font-size: 14px; }
  .pc-sum div { display: flex; justify-content: space-between; padding: 4px 0; }
  .pc-sum .saving span:last-child { font-weight: 700; color: var(--brand); }
  .pc-sum .saving span:first-child::before {
    content: "Clubcard"; display: inline-block; margin-right: 6px;
    background: var(--clubcard); color: var(--brand-dark);
    font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 3px;
  }
  .pc-sum .total { font-size: 18px; font-weight: 700; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 10px; }
  .pc-hint {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    background: #fff8cc; color: var(--brand-dark); font-size: 13px; font-weight: 600;
  }
  .pc-empty { padding: 28px 0; text-align: center; font-size: 14px; color: var(--text-muted); }
  .pc-clear {
    display: block; width: 100%; margin-top: 16px;
    height: 42px; border-radius: 21px;
    border: 2px solid var(--brand); color: var(--brand); font-weight: 700;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: absolute; left: 16px; right: 16px;
    bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px);
    background: #222; color: #fff;
    padding: 12px 16px; border-radius: 10px;
    font-size: 14px; text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
    opacity: 0; transform: translateY(10px);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
    z-index: 40;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .app:has(.price-bar:not([hidden])) .toast { bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 76px); }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar">
      <span id="clock">9:41</span>
      <span class="icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="21" height="11" rx="3"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="currentColor" stroke="none"/><path d="M23 4v4" stroke-width="1.5"/></svg>
      </span>
    </div>

    <div class="app">
      <header class="header">
        <button class="icon-btn" data-demo aria-label="Back">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1>Special offer</h1>
        <div class="actions">
          <button class="icon-btn" data-search aria-label="Search">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          </button>
          <button class="icon-btn" data-pricecheck aria-label="Price check">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2"/><rect x="8" y="5.5" width="8" height="4" rx="1"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/></svg>
            <span class="badge" id="basketBadge" hidden>0</span>
          </button>
        </div>
      </header>

      <div class="searchbar" id="searchbar" hidden>
        <label class="search-field">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="searchInput" type="search" placeholder="Search this offer" autocomplete="off" enterkeyhint="search">
          <button class="clear-btn" id="clearBtn" aria-label="Clear search" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </label>
        <button class="cancel-btn" id="cancelBtn">Cancel</button>
      </div>

      <main class="content">
        <section class="offer">
          <div class="offer-tag">
            <div class="cc">Clubcard<br>Price</div>
            <div class="deal">Any 3 for 2 Clubcard Price - Cheapest Product Free - Selected Breakfast Favourites</div>
          </div>
          <div class="valid">Valid in Hammersmith Superstore</div>
        </section>

        <div class="result-count" id="resultCount" hidden></div>
        <div id="products"></div>
        <div class="list-end" id="listEnd"></div>
      </main>

      <button class="price-bar" id="priceBar" data-pricecheck hidden>
        <span>
          <span class="pb-label" id="pbLabel"></span>
          <span class="pb-total" id="pbTotal"></span>
        </span>
        <span class="pb-cta">View price check ›</span>
      </button>

      <nav class="tabbar">
        <button class="tab" data-demo>
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"/></svg></span>
          Home
        </button>
        <button class="tab" data-demo>
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></span>
          Favourites
        </button>
        <button class="tab active" data-search>
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg></span>
          Search
        </button>
        <button class="tab" data-demo>
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 11h6M9 14h6"/></svg></span>
          Clubcard
        </button>
        <button class="tab" data-demo>
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-2 10H5z"/><path d="M8 10l3-6M16 10l-3-6M9 14v3M12 14v3M15 14v3"/></svg></span>
          Basket
        </button>
      </nav>

      <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
      <section class="sheet" id="sheet" aria-label="Price check" aria-hidden="true">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h2>Price check</h2>
          <button class="icon-btn" id="sheetClose" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <p class="sheet-note">See what your chosen items would cost at Hammersmith Superstore. This isn't a basket, so you can't order from here.</p>
        <div class="sheet-body" id="sheetBody"></div>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>

<script>
  // ---------- Product data ----------
  const products = [
    { id: 9, img: 'very-lazy-garlic.svg', name: 'Very Lazy Chopped Garlic 200G',         price: 1.95, unit: '£9.75/kg',   aisle: 11 },
    { id: 1, emoji: '🥣', name: 'Tesco Golden Honey Oat Granola 500G',  price: 2.10, unit: '£4.20/kg',   aisle: 7 },
    { id: 2, emoji: '🍯', name: 'Rowse Squeezy Clear Honey 340G',        price: 3.25, unit: '£9.56/kg',   aisle: 8 },
    { id: 3, emoji: '🥜', name: 'Whole Earth Smooth Peanut Butter 340G', price: 2.95, unit: '£8.68/kg',   aisle: 8 },
    { id: 4, emoji: '🍓', name: 'Bonne Maman Strawberry Conserve 370G',  price: 2.80, unit: '£7.57/kg',   aisle: 8 },
    { id: 5, emoji: '🌾', name: 'Quaker Oat So Simple Golden Syrup 10 x 36G', price: 3.50, unit: '£9.73/kg', aisle: 7 },
    { id: 6, emoji: '🍫', name: 'Nutella Hazelnut Chocolate Spread 350G', price: 3.15, unit: '£9.00/kg',  aisle: 8 },
    { id: 7, emoji: '🥞', name: 'Tesco Scotch Pancakes 6 Pack',          price: 1.10, unit: '£0.18 each', aisle: 2 },
    { id: 8, emoji: '🧇', name: 'Tesco Sweet Belgian Waffles 8 Pack',    price: 1.60, unit: '£0.20 each', aisle: 2 },
  ];

  // Price check starts with garlic already added
  const basket = { 9: 1 };
  const favourites = new Set();

  const listEl = document.getElementById('products');
  const badgeEl = document.getElementById('basketBadge');

  const heart = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>';

  // ---------- Search ----------
  const searchbar = document.getElementById('searchbar');
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const countEl = document.getElementById('resultCount');
  const endEl = document.getElementById('listEnd');
  let query = '';

  function openSearch() {
    searchbar.hidden = false;
    searchInput.focus();
  }
  function closeSearch() {
    searchbar.hidden = true;
    searchInput.value = '';
    setQuery('');
  }
  function setQuery(q) {
    query = q.trim().toLowerCase();
    clearBtn.hidden = !q;
    renderProducts();
  }
  searchInput.addEventListener('input', () => setQuery(searchInput.value));
  searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchInput.blur(); });
  clearBtn.addEventListener('click', e => {
    e.preventDefault();
    searchInput.value = '';
    setQuery('');
    searchInput.focus();
  });
  document.getElementById('cancelBtn').addEventListener('click', closeSearch);

  const pin = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';

  const thumb = p => p.img ? `<img src="${p.img}" alt="">` : p.emoji;

  function renderProducts() {
    // Every word typed must appear somewhere in the product name
    const words = query.split(/\s+/).filter(Boolean);
    const visible = products.filter(p => {
      const text = `${p.name} aisle ${p.aisle}`.toLowerCase();
      return words.every(w => text.includes(w));
    });

    countEl.hidden = !query;
    countEl.textContent = `${visible.length} result${visible.length === 1 ? '' : 's'} for “${searchInput.value.trim()}”`;
    endEl.innerHTML = !visible.length
      ? `<strong>No products found</strong>Try a different search term`
      : query ? '' : `You've reached the end of this offer`;

    listEl.innerHTML = visible.map(p => {
      const qty = basket[p.id] || 0;
      const control = qty
        ? `<div class="stepper">
             <button data-dec="${p.id}" aria-label="Remove one">−</button>
             <span>${qty}</span>
             <button data-inc="${p.id}" aria-label="Add one">+</button>
           </div>`
        : `<button class="add-btn" data-inc="${p.id}">Add</button>`;
      return `
        <article class="product">
          <div class="product-img">${thumb(p)}</div>
          <div class="product-name">${p.name}</div>
          <button class="fav${favourites.has(p.id) ? ' on' : ''}" data-fav="${p.id}" aria-label="Favourite">${heart}</button>
          <div class="buy-row">
            <div>
              <div class="price">£${p.price.toFixed(2)}</div>
              <div class="unit">${p.unit}</div>
            </div>
            <span class="aisle">${pin} Aisle ${p.aisle}</span>
            ${control}
          </div>
        </article>`;
    }).join('');
  }

  // ---------- Price check ----------
  const fmt = n => `£${n.toFixed(2)}`;

  // Any 3 for 2: in each group of 3 (most expensive first), the cheapest is free
  function priceCheck() {
    const lines = products.filter(p => basket[p.id]).map(p => ({ p, qty: basket[p.id] }));
    const units = lines.flatMap(({ p, qty }) => Array(qty).fill(p.price)).sort((a, b) => b - a);
    const subtotal = units.reduce((a, b) => a + b, 0);
    const saving = units.filter((_, i) => i % 3 === 2).reduce((a, b) => a + b, 0);
    return { lines, count: units.length, subtotal, saving, total: subtotal - saving };
  }

  const priceBar = document.getElementById('priceBar');
  const sheet = document.getElementById('sheet');
  const sheetBody = document.getElementById('sheetBody');
  const backdrop = document.getElementById('sheetBackdrop');

  function renderPriceCheck() {
    const { lines, count, subtotal, saving, total } = priceCheck();

    badgeEl.hidden = count === 0;
    badgeEl.textContent = count;
    priceBar.hidden = count === 0;
    document.getElementById('pbLabel').textContent = `${count} item${count === 1 ? '' : 's'} · estimated with Clubcard`;
    document.getElementById('pbTotal').textContent = fmt(total);

    if (!count) {
      sheetBody.innerHTML = `<div class="pc-empty">Add items from this offer to see what they'd cost.</div>`;
      return;
    }
    const toNext = 3 - (count % 3);
    sheetBody.innerHTML = `
      ${lines.map(({ p, qty }) => `
        <div class="pc-line">
          <span class="emoji">${thumb(p)}</span>
          <div>
            <div>${p.name}</div>
            <div class="meta">${qty} × ${fmt(p.price)} · Aisle ${p.aisle}</div>
          </div>
          <span class="amt">${fmt(qty * p.price)}</span>
        </div>`).join('')}
      <div class="pc-sum">
        <div><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
        ${saving ? `<div class="saving"><span>3 for 2 saving</span><span>−${fmt(saving)}</span></div>` : ''}
        <div class="total"><span>Estimated total</span><span>${fmt(total)}</span></div>
      </div>
      ${toNext < 3 ? `<div class="pc-hint">Add ${toNext} more item${toNext === 1 ? '' : 's'} to get the cheapest one free</div>` : ''}
      <button class="pc-clear" id="pcClear">Clear price check</button>`;
  }

  function openSheet() {
    renderPriceCheck();
    backdrop.hidden = false;
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
  }
  function closeSheet() {
    backdrop.hidden = true;
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
  }
  backdrop.addEventListener('click', closeSheet);
  document.getElementById('sheetClose').addEventListener('click', closeSheet);

  // ---------- Toast ----------
  const toastEl = document.getElementById('toast');
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  // ---------- Events ----------
  document.addEventListener('click', e => {
    if (e.target.closest('[data-demo]')) return toast('Not part of this demo');
    if (e.target.closest('[data-search]')) return openSearch();
    if (e.target.closest('[data-pricecheck]')) return openSheet();
    if (e.target.closest('#pcClear')) {
      for (const id in basket) delete basket[id];
      renderProducts();
      renderPriceCheck();
      return closeSheet();
    }

    const fav = e.target.closest('[data-fav]');
    if (fav) {
      const id = Number(fav.dataset.fav);
      favourites.has(id) ? favourites.delete(id) : favourites.add(id);
      toast(favourites.has(id) ? 'Added to favourites' : 'Removed from favourites');
      return renderProducts();
    }

    const inc = e.target.closest('[data-inc]');
    const dec = e.target.closest('[data-dec]');
    if (inc || dec) {
      const id = (inc || dec).dataset[inc ? 'inc' : 'dec'];
      basket[id] = Math.max(0, (basket[id] || 0) + (inc ? 1 : -1));
      if (inc && basket[id] === 1) toast('Added to price check');
      renderProducts();
      renderPriceCheck();
    }
  });

  // Status bar clock (desktop frame only)
  const clock = document.getElementById('clock');
  const tick = () => clock.textContent =
    new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/i, '');
  tick(); setInterval(tick, 30000);

  renderProducts();
  renderPriceCheck();
</script>
</body>
</html>
